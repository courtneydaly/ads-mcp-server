[project]
name = "ads-mcp-server"
version = "0.1.0"
description = "Read-only MCP server for cross-platform paid media performance and budget pacing"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0,<3", "duckdb>=1.1"]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.25"]
dev = ["pytest>=8"]

[project.scripts]
ads-mcp = "ads_mcp.server:main"

[tool.setuptools]
packages = ["ads_mcp"]

[tool.pytest.ini_options]
pythonpath = ["."]
